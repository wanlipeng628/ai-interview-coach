name: Deploy

# 只手动触发：在仓库的 Actions 页选 Deploy -> Run workflow，选目标后点击。
on:
  workflow_dispatch:
    inputs:
      target:
        description: '要部署什么'
        required: true
        default: web
        type: choice
        options:
          - web
          - backend
          - all

# 同一个时间只允许一个部署在跑，避免两次点击互相打架
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署（${{ inputs.target }}）
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "目标：$DEPLOY_USER@$DEPLOY_HOST"

      - name: 安装依赖
        if: ${{ inputs.target != 'backend' }}
        working-directory: frontend
        run: npm ci

      - name: 构建前端
        if: ${{ inputs.target != 'backend' }}
        working-directory: frontend
        run: npm run build

      - name: 发布前端
        if: ${{ inputs.target != 'backend' }}
        run: |
          tar -czf - -C frontend/dist . \
            | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" web

      - name: 发布后端
        if: ${{ inputs.target != 'web' }}
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" backend

      - name: 发布后自检
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" verify

      - name: 线上当前状态
        if: always()
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" status || true
